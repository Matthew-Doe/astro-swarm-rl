[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "astroswarm-mcp"
version = "0.1.0"
description = "MCP tools for developing and benchmarking AstroSwarm algorithms"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0,<3",
]

[project.scripts]
astroswarm-mcp = "astroswarm_mcp.server:main"

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/astroswarm_mcp"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: runs the real Godot benchmark",
]
