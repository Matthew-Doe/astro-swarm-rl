[build-system]
requires = ["scikit-build-core>=0.11", "pybind11>=3.0"]
build-backend = "scikit_build_core.build"

[project]
name = "astroswarm-rl"
version = "0.1.0"
description = "High-throughput C++ simulation and self-play training for AstroSwarm"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
]

[project.optional-dependencies]
train = ["tensorboard>=2.18"]
dev = ["pytest>=8.4"]

[project.scripts]
astroswarm-rl = "astroswarm_rl.cli:main"

[tool.scikit-build]
cmake.source-dir = "."
wheel.packages = ["src/astroswarm_rl"]
build-dir = "build/{wheel_tag}"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
