# Tracking + 10x anti-camping, with a large bonus for never-detected goals.
[simulator]
profile = "balanced_self_play"
defender_fov_min_degrees = 35.0
defender_fov_max_degrees = 75.0
defender_camp_radius = 180.0
defender_camp_penalty = 0.01
detection_reward = 0.05
capture_reward = 1.0
clean_goal_reward = 5.0
tracking_reward = 0.003
closing_reward = 0.0

[ppo]
snapshot_interval = 10
